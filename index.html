        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        @media print {
            body * { visibility: hidden; }
            #printableReceipt, #printableReceipt * { visibility: visible; }
            #printableReceipt { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 15px; }
        }
        .product-card {
            transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
            will-change: transform;
        }
        .product-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -6px rgba(79, 70, 229, 0.12);
            border-color: #c7d2fe;
        }
        .product-card .img-wrap { aspect-ratio: 1 / 1; background-color: #f8fafc; }
        .size-btn { transition: transform .1s ease, background-color .12s ease, color .12s ease; }
        .size-btn:active:not(:disabled) { transform: scale(0.92); }

        /* ===== Theme: Black ===== */
        body[data-theme="black"] { background-color: #000000 !important; color: #e5e7eb !important; }
        body[data-theme="black"] .bg-white,
        body[data-theme="black"] .bg-slate-50,
        body[data-theme="black"] .bg-slate-100 { background-color: #0a0a0a !important; }
        body[data-theme="black"] .text-slate-800,
        body[data-theme="black"] .text-slate-900,
        body[data-theme="black"] .text-slate-700 { color: #f3f4f6 !important; }
        body[data-theme="black"] .text-slate-600,
        body[data-theme="black"] .text-slate-500,
        body[data-theme="black"] .text-slate-400 { color: #9ca3af !important; }
        body[data-theme="black"] .border-slate-200,
        body[data-theme="black"] .border-slate-100,
        body[data-theme="black"] .border-slate-300,
        body[data-theme="black"] .divide-slate-100 > * { border-color: #262626 !important; }
        body[data-theme="black"] input,
        body[data-theme="black"] select,
        body[data-theme="black"] textarea { background-color: #111111 !important; color: #f3f4f6 !important; border-color: #333333 !important; }
        body[data-theme="black"] .product-card .img-wrap { background-color: #111111 !important; }

        /* ===== Theme: Dark Gray ===== */
        body[data-theme="darkgray"] { background-color: #0f172a !important; color: #e2e8f0 !important; }
        body[data-theme="darkgray"] .bg-white,
        body[data-theme="darkgray"] .bg-slate-50,
        body[data-theme="darkgray"] .bg-slate-100 { background-color: #1e293b !important; }
        body[data-theme="darkgray"] .text-slate-800,
        body[data-theme="darkgray"] .text-slate-900,
        body[data-theme="darkgray"] .text-slate-700 { color: #f1f5f9 !important; }
        body[data-theme="darkgray"] .text-slate-600,
        body[data-theme="darkgray"] .text-slate-500,
        body[data-theme="darkgray"] .text-slate-400 { color: #94a3b8 !important; }
        body[data-theme="darkgray"] .border-slate-200,
        body[data-theme="darkgray"] .border-slate-100,
        body[data-theme="darkgray"] .border-slate-300,
        body[data-theme="darkgray"] .divide-slate-100 > * { border-color: #334155 !important; }
        body[data-theme="darkgray"] input,
        body[data-theme="darkgray"] select,
        body[data-theme="darkgray"] textarea { background-color: #0f172a !important; color: #e2e8f0 !important; border-color: #334155 !important; }
        body[data-theme="darkgray"] .product-card .img-wrap { background-color: #1e293b !important; }
    </style>

                    <label class="flex items-center gap-2 text-xs text-slate-600 select-none cursor-pointer">
                        <input type="checkbox" id="rememberMeCheckbox" class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
                        Remember my username
                    </label>
                </div>
                <button id="loginSubmitBtn" onclick="handleLogin()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition">
                    Login
                </button>
                <p class="text-center text-[10px] text-slate-400">Created by Ny LARTHONGCHANH</p>
            </div>
        </div>
    </div>


    <!-- Toast Notification -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <script>
        const LOGIN_API_URL = 'https://script.google.com/macros/s/AKfycbztsZWz_RwuFDdyqwvSlGkvBSw0M8VWsY4ewpmts2dfedcJbwXtwTtq77YkNytIjhousw/exec';

        const SESSION_KEY = 'pos_session';
        const NOTICE_KEY = 'pos_notice';
        const LOCK_KEY = 'pos_login_lock_until';
        const HOME_PAGE = 'home.html';

        // ป้องกันการยิง login รัวๆ จากฝั่ง client (มาตรการเสริม — การป้องกันจริงอยู่ที่ backend)
        const LOGIN_MAX_ATTEMPTS = 5;
        const LOGIN_LOCKOUT_MS = 60 * 1000; // 60 วินาที
        let loginFailCount = 0;
        let loginLockedUntil = 0;
        try { loginLockedUntil = parseInt(sessionStorage.getItem(LOCK_KEY), 10) || 0; } catch (e) {}

        function goTo(url) { location.replace(url); }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const colors = { success: 'bg-emerald-600', error: 'bg-rose-600', warning: 'bg-amber-500', info: 'bg-slate-800' };
            toast.className = `${colors[type]} text-white px-4 py-3 rounded-xl shadow-lg text-xs font-medium flex items-center space-x-2 transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-2', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function applySavedTheme() {
            let saved = 'white';
            try { saved = localStorage.getItem('pos_theme') || 'white'; } catch (e) {}
            if (saved !== 'white') document.body.setAttribute('data-theme', saved);
        }

        let loginInProgress = false;

        async function handleLogin() {
            if (loginInProgress) return; // กันเรียกซ้ำ (เช่น กด Enter รัว)
            const now = Date.now();
            if (now < loginLockedUntil) {
                const secs = Math.ceil((loginLockedUntil - now) / 1000);
                showToast(`Too many attempts. Please wait ${secs} seconds.`, 'error');
                return;
            }

            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if (!username || !password) {
                showToast('Please enter Username and Password', 'error');
                return;
            }

            loginInProgress = true;
            const loginBtn = document.getElementById('loginSubmitBtn');
            if (loginBtn) loginBtn.disabled = true;
            showToast('Verifying...', 'info');

            try {
                const response = await fetch(LOGIN_API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'login', username: username, password: password })
                });
                const result = await response.json();

                if (result.status === 'success') {
                    // ต้องได้ token จาก backend เท่านั้น ถึงจะเข้าหน้า home ได้
                    if (!result.token) {
                        showToast('Login OK but the server did not return a session token. Please contact the admin.', 'error');
                        return;
                    }
                    loginFailCount = 0;
                    try { sessionStorage.removeItem(LOCK_KEY); } catch (e) {}
                    const cashierName = result.username || username;
                    try {
                        const remember = document.getElementById('rememberMeCheckbox').checked;
                        if (remember) localStorage.setItem('pos_remembered_username', username);
                        else localStorage.removeItem('pos_remembered_username');
                    } catch (e) {}
                    try { sessionStorage.setItem(SESSION_KEY, JSON.stringify({ username: cashierName, token: result.token })); } catch (e) {}
                    document.getElementById('loginPassword').value = '';
                    showToast('Login successful!', 'success');
                    goTo(HOME_PAGE);
                } else {
                    loginFailCount++;
                    if (loginFailCount >= LOGIN_MAX_ATTEMPTS) {
                        loginLockedUntil = Date.now() + LOGIN_LOCKOUT_MS;
                        try { sessionStorage.setItem(LOCK_KEY, String(loginLockedUntil)); } catch (e) {}
                        loginFailCount = 0;
                        showToast(`Too many failed attempts (${LOGIN_MAX_ATTEMPTS}). Please wait ${LOGIN_LOCKOUT_MS/1000} seconds.`, 'error');
                    } else {
                        showToast('Incorrect Username or Password', 'error');
                    }
                }
            } catch (error) {
                console.error(error);
                showToast('Connection error occurred', 'error');
            } finally {
                loginInProgress = false;
                if (loginBtn) loginBtn.disabled = false;
            }
        }

        window.onload = function() {
            try { localStorage.removeItem('pos_login_logs'); } catch (e) {} // ลบ Login History เก่าที่เคยเก็บไว้ในเครื่อง
            applySavedTheme();
            lucide.createIcons();

            // ถ้ามี session อยู่แล้ว (เช่น กด Back กลับมาหน้า login) ให้ไปหน้า home — หน้า home จะตรวจ token กับ backend เอง
            try {
                const s = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null');
                if (s && s.username && s.token) { goTo(HOME_PAGE); return; }
            } catch (e) {}

            // แจ้งเหตุผลที่ถูกส่งกลับมาหน้า login (หมดอายุ / ออกจากระบบ / ไม่มีการใช้งาน)
            try {
                const notice = sessionStorage.getItem(NOTICE_KEY);
                if (notice) {
                    sessionStorage.removeItem(NOTICE_KEY);
                    const msgs = {
                        expired: ['Session expired. Please log in again.', 'error'],
                        idle: ['Logged out due to inactivity.', 'info'],
                        logout: ['Logged out', 'info']
                    };
                    if (msgs[notice]) showToast(msgs[notice][0], msgs[notice][1]);
                }
            } catch (e) {}

            // เติม Username ที่จำไว้ (ถ้ามี) ลงในฟอร์ม login อัตโนมัติ
            try {
                const rememberedUsername = localStorage.getItem('pos_remembered_username');
                if (rememberedUsername) {
                    document.getElementById('loginUsername').value = rememberedUsername;
                    document.getElementById('rememberMeCheckbox').checked = true;
                    document.getElementById('loginPassword').focus();
                }
            } catch (e) {}

            // กด Enter เพื่อ Login
            ['loginUsername', 'loginPassword'].forEach(id => {
                document.getElementById(id).addEventListener('keydown', e => {
                    if (e.key === 'Enter') handleLogin();
                });
            });
        };

        // กด Back จาก bfcache กลับมาหน้านี้หลัง login แล้ว
        window.addEventListener('pageshow', function (e) {
            if (!e.persisted) return;
            try {
                const s = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null');
                if (s && s.token) goTo(HOME_PAGE);
            } catch (err) {}
        });

    </script>
</body>
</html>
